<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit a product review for Fegor Homes Ltd products and services.">
  <meta name="author" content="Onaimor Godspower">
  <title>Product Review | Fegor Homes Ltd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Raleway:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <p class="header-brand">Fegor Homes Ltd</p>
      <h1>Product Review</h1>
      <p class="header-sub">Share your experience with our products and services</p>
    </div>
  </header>

  <main>
    <div class="form-wrapper">

      <form method="get" action="review.html" id="review-form">

       
        <div class="form-group">
          <label for="product-name">Product Name</label>
          <select id="product-name" name="product-name" required>
            <option value="" disabled selected>Select a Product ...</option>
          </select>
        </div>

    
        <fieldset class="form-group rating-group">
          <legend>Overall Rating</legend>
          <div class="star-rating">

            <div class="star-option">
              <input type="radio" id="rating-1" name="rating" value="1" required>
              <label for="rating-1">
                <span class="stars">&#9733;</span>
                <span class="rating-label">1</span>
              </label>
            </div>

            <div class="star-option">
              <input type="radio" id="rating-2" name="rating" value="2">
              <label for="rating-2">
                <span class="stars">&#9733;&#9733;</span>
                <span class="rating-label">2</span>
              </label>
            </div>

            <div class="star-option">
              <input type="radio" id="rating-3" name="rating" value="3">
              <label for="rating-3">
                <span class="stars">&#9733;&#9733;&#9733;</span>
                <span class="rating-label">3</span>
              </label>
            </div>

            <div class="star-option">
              <input type="radio" id="rating-4" name="rating" value="4">
              <label for="rating-4">
                <span class="stars">&#9733;&#9733;&#9733;&#9733;</span>
                <span class="rating-label">4</span>
              </label>
            </div>

            <div class="star-option">
              <input type="radio" id="rating-5" name="rating" value="5">
              <label for="rating-5">
                <span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
                <span class="rating-label">5</span>
              </label>
            </div>

          </div>
        </fieldset>

       
        <div class="form-group">
          <label for="install-date">Date of Installation</label>
          <input type="date" id="install-date" name="install-date" required>
        </div>

      
        <fieldset class="form-group checkbox-group">
          <legend>Which features did you find useful in the product? <span class="optional-tag">(Check all that apply)</span></legend>

          <div class="checkbox-option">
            <input type="checkbox" id="feature-durability" name="features" value="Durability">
            <label for="feature-durability">Durability</label>
          </div>

          <div class="checkbox-option">
            <input type="checkbox" id="feature-ease" name="features" value="Ease of Use">
            <label for="feature-ease">Ease of Use</label>
          </div>

          <div class="checkbox-option">
            <input type="checkbox" id="feature-performance" name="features" value="Performance">
            <label for="feature-performance">Performance</label>
          </div>

          <div class="checkbox-option">
            <input type="checkbox" id="feature-design" name="features" value="Design">
            <label for="feature-design">Design</label>
          </div>

          <div class="checkbox-option">
            <input type="checkbox" id="feature-value" name="features" value="Value for Money">
            <label for="feature-value">Value for Money</label>
          </div>

        </fieldset>

        
        <div class="form-group">
          <label for="written-review">Written Review <span class="optional-tag">(Optional)</span></label>
          <textarea id="written-review" name="written-review" rows="5" placeholder="Share your detailed experience with this product..."></textarea>
        </div>

        
        <div class="form-group">
          <label for="user-name">Your Name <span class="optional-tag">(Optional)</span></label>
          <input type="text" id="user-name" name="user-name" placeholder="Enter your name">
        </div>

        
        <div class="form-group submit-group">
          <input type="submit" value="Post Review" id="submit-btn">
        </div>

      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 &#127968; Fegor Homes Ltd &#127968;</p>
    <p id="last-modified"></p>
  </footer>

  <script src="scripts/form.js"></script>
</body>
</html>
